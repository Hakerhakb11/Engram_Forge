build-backend = "poetry.core.masonry.api"

[dependency-groups]
train = [
    "datasets (>=5.0.1,<6.0.0)",
    "transformers (>=5.14.1,<6.0.0)",
    "accelerate (>=1.14.0,<2.0.0)",
    "trl (>=1.9.2,<2.0.0)"
]
