[project]
name = "engram-forge"
version = "0.1.0"
description = ""
authors = [
    {name = "Hakerhakb11",email = "igorshilov2007@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ijson (>=3.5.1,<4.0.0)"
